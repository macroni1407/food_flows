version: 2
models:
  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships: { to: ref('dim_customer'), field: customer_id }   # referential integrity
      - name: order_status
        tests:
          - accepted_values: { values: ['Delivered','Cancelled','Refunded'] }
  - name: dim_restaurants_history
    columns:
      - name: restaurant_version_key
        tests: [unique, not_null]
      - name: valid_from
        tests: [not_null]
  - name: fct_orders_point_in_time
    columns:
      - name: restaurant_version_key
        tests:
          - not_null:
              config:
                severity: warn   # an order whose restaurant is missing from the restaurant data

